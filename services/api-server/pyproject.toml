[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-api-server"
version = "0.1.0"
description = "P0 API and persistence service for the industrial SOP platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "opencv-python-headless>=4.11,<5",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]
vision = ["ultralytics>=8.4,<8.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["sop_api*"]
